name: Deploy and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Runs once the repository variable CI_ENABLED is set to true, after the four secrets are in place.
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Sign in to the test org
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          printf '%s\n' "$SF_JWT_KEY" > server.key
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias ci

      - name: Validate the deploy and run the named tests
        run: >
          sf project deploy validate
          --source-dir force-app/main/default/classes/DealMetrics.cls
          --source-dir force-app/main/default/classes/DealMetricsTest.cls
          --target-org ci
          --test-level RunSpecifiedTests
          --tests DealMetricsTest
          --wait 30

      - name: Remove the key
        if: always()
        run: rm -f server.key
